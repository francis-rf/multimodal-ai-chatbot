[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-chatbot"
version = "0.1.0"
description = "Multi-modal AI chatbot with vision, speech, and image generation"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==23.2.1",
    "aiohttp==3.9.1",
    "black==24.1.1",
    "fastapi==0.109.0",
    "fireworks-ai==0.9.0",
    "flake8==7.0.0",
    "google-generativeai==0.3.2",
    "groq==0.4.2",
    "httpx==0.26.0",
    "openai==1.10.0",
    "pillow==10.2.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "pydub==0.25.1",
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "tavily-python==0.3.3",
    "uvicorn[standard]==0.27.0",
]

[tool.setuptools.packages.find]
include = ["models*", "services*", "utils*"]
